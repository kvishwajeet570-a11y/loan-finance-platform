<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dbeafe"/>
    <stop offset="0.58" stop-color="#eff6ff"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#64748b"/>
    <stop offset="1" stop-color="#1e293b"/>
  </linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#94a3b8"/>
    <stop offset="1" stop-color="#cbd5e1"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset="1" stop-color="#dbeafe" stop-opacity=".8"/>
  </linearGradient>
</defs>

<rect width="1400" height="430" fill="url(#sky)"/>

<!-- clouds -->
<g fill="#fff" opacity=".78">
  <ellipse cx="220" cy="90" rx="95" ry="28"/>
  <ellipse cx="300" cy="88" rx="70" ry="24"/>
  <ellipse cx="1070" cy="72" rx="110" ry="30"/>
  <ellipse cx="1160" cy="76" rx="75" ry="25"/>
</g>

<!-- distant hills -->
<path d="M0 245 L180 135 L300 220 L450 110 L610 225 L770 125 L940 230 L1100 120 L1270 220 L1400 145 L1400 310 L0 310Z" fill="url(#hill)" opacity=".55"/>

<!-- greenery -->
<path d="M0 285 Q180 245 340 280 T680 275 T1020 280 T1400 270 L1400 430 L0 430Z" fill="#d1fae5"/>
<path d="M0 315 Q220 275 430 310 T850 305 T1200 315 T1400 300 L1400 430 L0 430Z" fill="#bbf7d0"/>

<!-- road -->
<path d="M440 430 L620 270 L780 270 L1040 430Z" fill="url(#road)"/>
<path d="M680 430 L690 275 L710 275 L760 430Z" fill="#f8fafc" opacity=".8"/>
<path d="M830 430 L755 275 L770 275 L900 430Z" fill="#f8fafc" opacity=".55"/>

<!-- toll plaza -->
<g>
  <rect x="500" y="170" width="420" height="18" rx="4" fill="#334155"/>
  <rect x="525" y="188" width="12" height="105" fill="#475569"/>
  <rect x="882" y="188" width="12" height="105" fill="#475569"/>

  <rect x="550" y="125" width="320" height="52" rx="8" fill="url(#glass)" stroke="#93c5fd" stroke-width="2"/>
  <rect x="615" y="136" width="190" height="30" rx="7" fill="#059669"/>
  <text x="710" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="white">FASTag</text>

  <rect x="565" y="202" width="85" height="65" rx="4" fill="#e2e8f0"/>
  <rect x="667" y="202" width="85" height="65" rx="4" fill="#e2e8f0"/>
  <rect x="769" y="202" width="85" height="65" rx="4" fill="#e2e8f0"/>

  <rect x="570" y="210" width="75" height="20" rx="3" fill="#22c55e"/>
  <rect x="672" y="210" width="75" height="20" rx="3" fill="#3b82f6"/>
  <rect x="774" y="210" width="75" height="20" rx="3" fill="#f59e0b"/>
</g>

<!-- car -->
<g>
  <rect x="676" y="302" width="110" height="62" rx="20" fill="#0f172a"/>
  <path d="M695 302 L714 280 L756 280 L774 302Z" fill="#334155"/>
  <rect x="715" y="287" width="40" height="20" rx="4" fill="#bfdbfe"/>
  <circle cx="700" cy="360" r="14" fill="#020617"/>
  <circle cx="763" cy="360" r="14" fill="#020617"/>
  <rect x="716" y="324" width="32" height="12" rx="3" fill="#22d3ee"/>
  <rect x="722" y="345" width="20" height="7" rx="2" fill="#f8fafc"/>
</g>

<!-- road signs -->
<g>
  <rect x="1080" y="115" width="150" height="65" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1155" y="140" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#1e3a8a">SMOOTH</text>
  <text x="1155" y="158" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">JOURNEYS AHEAD</text>
  <path d="M1140 180 L1120 235" stroke="#2563eb" stroke-width="5"/>
  <path d="M1120 235 L1110 220 M1120 235 L1137 225" stroke="#2563eb" stroke-width="5"/>
</g>

<!-- foreground lines -->
<path d="M60 370 L350 370" stroke="#94a3b8" stroke-width="3" opacity=".5"/>
<path d="M1040 380 L1340 380" stroke="#94a3b8" stroke-width="3" opacity=".5"/>

<!-- subtle blue overlay -->
<rect width="1400" height="430" fill="#2563eb" opacity=".025"/>
</svg>
